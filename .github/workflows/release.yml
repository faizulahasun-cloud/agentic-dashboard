name: Release assets

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to re-publish
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Check manifest version matches tag
        run: |
          v=$(jq -r .version manifest.json)
          if [ "$v" != "$TAG" ]; then
            echo "manifest.json is $v but tag is $TAG"
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Agentic Dashboard $TAG" --generate-notes
          fi
          gh release upload "$TAG" main.js styles.css manifest.json --clobber
